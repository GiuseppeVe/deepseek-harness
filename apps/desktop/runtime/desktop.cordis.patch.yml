# Final Desktop layer. Passed as the last `dsh --patch` overlay, so each boot
# and live user-layer recomposition reapplies these loopback-only values after
# profile and home patches.
- id: webserver
  config:
    host: '127.0.0.1'
    port: 3080

- upsert:
    - id: desktop-control
      name: '@deepseek-ai/dsh-host-desktop-control'
      config:
        token: !!js process.env.DSH_DESKTOP_CONTROL_TOKEN
